<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Virtual Math Lab Portfolio</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Link the CSS -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

    <!-- Header will load here automatically -->
    <div id="header-placeholder"></div>

    <div class="shell">
        <!-- HERO SECTION -->
        <section class="hero">
            <span class="eyebrow"><i class="fa-solid fa-wand-magic-sparkles"></i>&nbsp; interactive &middot; visual &middot; hands-on</span>
            <h1>Explore <span class="grad">Mathematics</span> Interactively</h1>
            <p>A growing collection of visual simulations...</p>
        </section>

        <!-- CONTROLS & GRID -->
        <div class="controls">
            <!-- Search Input and Filters paste here -->
        </div>

        <div class="results-meta">
            <span id="resultsCount">Showing 4 of 4 simulations</span>
            <span>MathLab Portal </span>
        </div>

        <div class="grid" id="grid">
            <!-- Card 1, 2, 3 etc. paste here -->
        </div>

        <div class="empty-state" id="emptyState">
            <i class="fa-solid fa-magnifying-glass-minus"></i>
            <b>No simulations found</b>
            <span>Try a different search term...</span>
        </div>
    </div>

    <!-- Footer will load here automatically -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="./assets/js/loader.js"></script>
    <script src="./assets/js/search-filter.js"></script>
</body>
</html>
